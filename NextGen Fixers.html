<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Fixers Kiosk System 🛠️</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --secondary-color: #1e293b;
      --accent-color: #f59e0b;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
      --success-color: #10b981;
      --danger-color: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

    /* Cashier Dashboard Layout */
    .dashboard-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .dashboard-container { grid-template-columns: 1fr; } }

    .panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .panel-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }

    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-success { background: var(--success-color); color: white; }
    .btn-danger { background: var(--danger-color); color: white; }
    .btn-accent { background: var(--accent-color); color: white; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    input[type="text"], input[type="number"], input[type="color"] { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; }

    .service-item-edit { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .service-card { border: 2px solid var(--border-color); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; user-select: none; }
    .service-card.selected { border-color: var(--primary-color); background-color: rgba(37, 99, 235, 0.08); }

    .summary-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    .summary-table th, .summary-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
    .summary-table th { background-color: var(--bg-color); }
    .totals { font-size: 1.1rem; font-weight: 700; text-align: right; margin-top: 10px; }

    .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
    .status-1 { background: #e2e8f0; color: #475569; }
    .status-2 { background: #dbeafe; color: #1e40af; }
    .status-3 { background: #fef3c7; color: #92400e; }
    .status-4 { background: #fef08a; color: #854d0e; }
    .status-5 { background: #d1fae5; color: #065f46; }

    .golden-card { background: #fef08a; border: 2px solid #eab308; color: #713f12; padding: 15px; border-radius: 8px; font-weight: bold; margin: 10px 0; }
  </style>
</head>
<body>

  <!-- CASHIER VIEW -->
  <div id="cashier-view">
    <div class="dashboard-container">
      
      <!-- LEFT PANEL: Setup Console & Dynamic Customizer -->
      <div class="panel">
        <div class="panel-header">
          <span>⚙️ Setup Console</span>
          <button class="btn btn-primary" onclick="openCustomerWindow()">🖥️ Open Customer Window</button>
        </div>

        <div class="form-group">
          <label>Primary Theme Color</label>
          <input type="color" id="themeColor" value="#2563eb" onchange="updateConfig()">
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label>Warranty Fee ($)</label>
          <input type="number" id="warrantyFee" value="15" onchange="updateConfig()">
        </div>

        <div style="margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="margin: 0;">Service Manager</label>
            <button class="btn btn-success" style="padding: 4px 8px; font-size: 0.8rem;" onclick="addService()">+ Add Service</button>
          </div>
          <div id="service-list-editor"></div>
        </div>

        <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px;">
          <button class="btn btn-accent" onclick="exportConfig()">💾 Export Config (.txt)</button>
          <button class="btn btn-primary" onclick="document.getElementById('importFile').click()">📂 Import Config</button>
          <input type="file" id="importFile" style="display: none;" accept=".txt" onchange="importConfig(event)">
        </div>
      </div>

      <!-- RIGHT PANEL: Transaction Control -->
      <div class="panel">
        <div class="panel-header">
          <span>🛒 Transaction Control</span>
          <span id="current-stage-badge" class="status-badge status-1">Stage 1: Idle</span>
        </div>

        <label>Select Services</label>
        <div class="services-grid" id="services-selector"></div>

        <div class="form-group">
          <label><input type="checkbox" id="warrantyToggle" onchange="calculateTotals()"> Include Warranty Fee</label>
        </div>

        <table class="summary-table">
          <thead><tr><th>Item</th><th style="text-align: right;">Price</th></tr></thead>
          <tbody id="cart-table-body">
            <tr><td colspan="2" style="text-align:center; color: #94a3b8;">No items selected</td></tr>
          </tbody>
        </table>

        <div class="totals">Total: $<span id="cart-total">0.00</span></div>

        <div id="golden-alert" class="golden-card" style="display: none;">💳 Status: Waiting for payment in Cash.</div>

        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn btn-primary" id="btn-checkout" onclick="setStage(3)">Check Out</button>
          <button class="btn btn-accent" id="btn-customer-yes" onclick="setStage(4)" disabled>Customer Yes</button>
          <button class="btn btn-success" id="btn-finished" onclick="setStage(5)" disabled>Finished</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Global State
    let state = {
      stage: 1, // 1: Idle, 2: Selection, 3: Verification, 4: Payment, 5: Completion
      themeColor: "#2563eb",
      warrantyFee: 15,
      includeWarranty: false,
      services: [
        { id: 1, name: "Screen Repair", price: 89.99 },
        { id: 2, name: "Battery Replacement", price: 49.99 },
        { id: 3, name: "Charging Port Fix", price: 39.99 }
      ],
      selectedServiceIds: []
    };

    let customerWin = null;

    // Direct Window Reference Sync
    function syncState() {
      renderCashierUI();
      if (customerWin && !customerWin.closed) {
        renderCustomerUI();
      }
    }

    function openCustomerWindow() {
      if (customerWin && !customerWin.closed) {
        customerWin.focus();
        return;
      }

      customerWin = window.open('', 'CustomerDisplay', 'width=800,height=600');
      
      if (customerWin) {
        customerWin.document.open();
        customerWin.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>NextGen Fixers - Customer View 📱</title>
            <style>
              :root { --primary-color: ${state.themeColor}; }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 40px; background-color: #f8fafc; color: #0f172a; }
              .welcome-title { font-size: 2.5rem; font-weight: 800; color: #2563eb; margin-bottom: 20px; }
              .status-display { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; }
              .pulsing { animation: pulse 2s infinite; }
              @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
              .summary-table { width: 100%; max-width: 450px; border-collapse: collapse; margin: 20px auto; background: white; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
              .summary-table th { padding: 12px 14px; background: #f1f5f9; text-align: left; border-bottom: 2px solid #e2e8f0; font-size: 0.95rem; }
              .summary-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 1.05rem; }
              .thank-you-screen { animation: rainbow 1.5s infinite linear; color: white; position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; padding: 20px; }
              @keyframes rainbow { 0% { background: #ef4444; } 20% { background: #f59e0b; } 40% { background: #10b981; } 60% { background: #2563eb; } 80% { background: #8b5cf6; } 100% { background: #ef4444; } }
            </style>
          </head>
          <body>
            <div id="customer-root" style="width: 100%;"></div>
          </body>
          </html>
        `);
        customerWin.document.close();
        renderCustomerUI();
      }
    }

    function renderCustomerUI() {
      if (!customerWin || customerWin.closed) return;

      const root = customerWin.document.getElementById('customer-root');
      if (!root) return;

      customerWin.document.documentElement.style.setProperty('--primary-color', state.themeColor);

      const selectedItems = state.services.filter(s => state.selectedServiceIds.includes(s.id));
      let subtotal = selectedItems.reduce((acc, curr) => acc + curr.price, 0);
      if (state.includeWarranty) subtotal += Number(state.warrantyFee);

      // Helper to generate live receipt HTML
      const renderReceiptTable = () => {
        if (selectedItems.length === 0 && !state.includeWarranty) {
          return `<div style="color: #94a3b8; margin-top: 15px; font-size: 1.1rem;">Waiting for items to be added...</div>`;
        }
        return `
          <table class="summary-table">
            <thead>
              <tr><th>Service Item</th><th style="text-align:right">Price</th></tr>
            </thead>
            <tbody>
              ${selectedItems.map(i => `<tr><td>${i.name}</td><td style="text-align:right">$${i.price.toFixed(2)}</td></tr>`).join('')}
              ${state.includeWarranty ? `<tr><td>Warranty Fee</td><td style="text-align:right">$${Number(state.warrantyFee).toFixed(2)}</td></tr>` : ''}
              <tr style="font-weight:bold; background: #f8fafc;"><td>Total Due</td><td style="text-align:right; color: #2563eb;">$${subtotal.toFixed(2)}</td></tr>
            </tbody>
          </table>
        `;
      };

      if (state.stage === 1) {
        root.innerHTML = `<div class="welcome-title">Welcome to NextGen Fixers! 🛠️</div>`;
      } else if (state.stage === 2) {
        root.innerHTML = `
          <div class="welcome-title">Welcome to NextGen Fixers! 🛠️</div>
          <div class="status-display" style="font-size: 1.5rem; color: #475569;">Getting your repair ready...</div>
          ${renderReceiptTable()}
        `;
      } else if (state.stage === 3) {
        root.innerHTML = `
          <div class="status-display">Everything looks correct down below?</div>
          ${renderReceiptTable()}
        `;
      } else if (state.stage === 4) {
        root.innerHTML = `
          <div class="status-display" style="color: #854d0e;">Please pay with Cash.</div>
          <div style="font-size: 1.6rem; font-weight: bold; margin-bottom: 10px;">Amount Due: $${subtotal.toFixed(2)}</div>
          ${renderReceiptTable()}
        `;
      } else if (state.stage === 5) {
        root.innerHTML = `<div class="thank-you-screen">Thank you for shopping with NextGen Fixers! 🎉</div>`;
      }
    }

    // Operational Actions
    function addService() {
      state.services.push({ id: Date.now(), name: "New Repair", price: 29.99 });
      syncState();
    }

    function deleteService(id) {
      state.services = state.services.filter(s => s.id !== id);
      state.selectedServiceIds = state.selectedServiceIds.filter(sid => sid !== id);
      if (state.selectedServiceIds.length === 0 && state.stage === 2) state.stage = 1;
      syncState();
    }

    function updateService(id, field, value) {
      const service = state.services.find(s => s.id === id);
      if (service) {
        service[field] = field === 'price' ? parseFloat(value) || 0 : value;
        syncState();
      }
    }

    function toggleServiceSelection(id) {
      const index = state.selectedServiceIds.indexOf(id);
      if (index > -1) state.selectedServiceIds.splice(index, 1);
      else state.selectedServiceIds.push(id);

      if (state.selectedServiceIds.length > 0 && state.stage === 1) state.stage = 2;
      else if (state.selectedServiceIds.length === 0 && state.stage === 2) state.stage = 1;

      syncState();
    }

    function calculateTotals() {
      state.includeWarranty = document.getElementById('warrantyToggle').checked;
      syncState();
    }

    function setStage(newStage) {
      state.stage = newStage;
      if (newStage === 5) {
        syncState();
        setTimeout(() => {
          state.stage = 1;
          state.selectedServiceIds = [];
          state.includeWarranty = false;
          if (document.getElementById('warrantyToggle')) document.getElementById('warrantyToggle').checked = false;
          syncState();
        }, 5000);
      } else {
        syncState();
      }
    }

    function updateConfig() {
      state.themeColor = document.getElementById('themeColor').value;
      state.warrantyFee = parseFloat(document.getElementById('warrantyFee').value) || 0;
      syncState();
    }

    // External Portability (.txt File Serializer)
    function exportConfig() {
      const blob = new Blob([JSON.stringify({ themeColor: state.themeColor, warrantyFee: state.warrantyFee, services: state.services }, null, 2)], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'nextgen_kiosk_config.txt';
      a.click();
    }

    function importConfig(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const cfg = JSON.parse(event.target.result);
          if (cfg.themeColor) state.themeColor = cfg.themeColor;
          if (cfg.warrantyFee !== undefined) state.warrantyFee = cfg.warrantyFee;
          if (Array.isArray(cfg.services)) state.services = cfg.services;
          syncState();
        } catch (err) { alert('Invalid file layout.'); }
      };
      reader.readAsText(file);
    }

    // Render Cashier Dashboard
    function renderCashierUI() {
      document.documentElement.style.setProperty('--primary-color', state.themeColor);

      const stageLabels = { 1: 'Stage 1: Idle', 2: 'Stage 2: Selection', 3: 'Stage 3: Verification', 4: 'Stage 4: Payment', 5: 'Stage 5: Completion' };
      const stageBadge = document.getElementById('current-stage-badge');
      stageBadge.className = `status-badge status-${state.stage}`;
      stageBadge.innerText = stageLabels[state.stage];

      document.getElementById('service-list-editor').innerHTML = state.services.map(s => `
        <div class="service-item-edit">
          <input type="text" value="${s.name}" onchange="updateService(${s.id}, 'name', this.value)">
          <input type="number" step="0.01" value="${s.price}" onchange="updateService(${s.id}, 'price', this.value)">
          <button class="btn btn-danger" style="padding: 4px 8px;" onclick="deleteService(${s.id})">X</button>
        </div>`).join('');

      document.getElementById('services-selector').innerHTML = state.services.map(s => `
        <div class="service-card ${state.selectedServiceIds.includes(s.id) ? 'selected' : ''}" onclick="toggleServiceSelection(${s.id})">
          <div style="font-weight: bold;">${s.name}</div>
          <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">$${s.price.toFixed(2)}</div>
        </div>`).join('');

      const selectedItems = state.services.filter(s => state.selectedServiceIds.includes(s.id));
      let rows = selectedItems.map(i => `<tr><td>${i.name}</td><td style="text-align: right;">$${i.price.toFixed(2)}</td></tr>`).join('');
      if (state.includeWarranty) rows += `<tr><td>Warranty Fee</td><td style="text-align: right;">$${Number(state.warrantyFee).toFixed(2)}</td></tr>`;
      document.getElementById('cart-table-body').innerHTML = rows || `<tr><td colspan="2" style="text-align:center; color: #94a3b8;">No items selected</td></tr>`;

      let total = selectedItems.reduce((acc, curr) => acc + curr.price, 0);
      if (state.includeWarranty) total += Number(state.warrantyFee);
      document.getElementById('cart-total').innerText = total.toFixed(2);

      document.getElementById('btn-checkout').disabled = state.selectedServiceIds.length === 0;
      document.getElementById('btn-customer-yes').disabled = state.stage < 3;
      document.getElementById('btn-finished').disabled = state.stage < 4;
      document.getElementById('golden-alert').style.display = state.stage === 4 ? 'block' : 'none';
    }

    // Initial Load
    renderCashierUI();
  </script>
</body>
</html>
